name: Automated Daily Product Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script & Verify Output
        run: |
          python scripts/ecommerce_scraper.py
          ls -la datasets/ || echo "Datasets directory missing"

      - name: Commit and Push Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datasets/*.csv
          git diff --cached --quiet || git commit -m "chore: add daily scraped dataset [skip ci]"
          git push origin main
